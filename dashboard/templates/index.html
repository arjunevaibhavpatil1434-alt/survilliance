<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Surveillance Dashboard</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <link href="{{ url_for('static', filename='css/dashboard.css') }}" rel="stylesheet">
</head>
<body>

  <div class="topbar">
    <h1>Surveillance Dashboard</h1>
    <div class="topbar-right">
      <div class="nav-pills-custom">
        <a href="/" class="active">Live Dashboard</a>
        <a href="/attendance">Attendance</a>
      </div>
      <div class="live-indicator">
        <span class="live-dot"></span>
        <span id="last-updated">Live &middot; updating...</span>
      </div>
    </div>
  </div>

  <div class="grid">

    <div class="panel">
      <div class="panel-title">Live Camera</div>
      <div class="camera-frame">
        <img id="video-feed" src="/video_feed" alt="Live camera stream">
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Face Status</div>
      <div class="status-card" id="face-status">
        <div class="status-ring">&mdash;</div>
        <div class="status-name text-muted">No events yet</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Event Logs</div>
      <div id="log-feed">
        <div class="empty-state">Loading events...</div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-title">Latest Unknown Face</div>
      <div id="gallery">
        <div class="empty-state">Loading...</div>
      </div>
    </div>

  </div>

  <script>
    const POLL_INTERVAL_MS = 3000;

    function badgeFor(eventType) {
      if (eventType === "KNOWN") return `<span class="badge badge-known">KNOWN</span>`;
      if (eventType === "UNKNOWN") return `<span class="badge badge-unknown">UNKNOWN</span>`;
      return `<span class="badge bg-secondary">${eventType ?? "N/A"}</span>`;
    }

    async function refreshFaceStatus() {
      const res = await fetch("/api/current_face");
      const data = await res.json();

      const box = document.getElementById("face-status");

      if (!data.event_type) {
        box.innerHTML = `
          <div class="status-ring">&mdash;</div>
          <div class="status-name text-muted">No events yet</div>
        `;
        return;
      }

      const isKnown = data.event_type === "KNOWN";
      const name = data.person_name ?? "Unknown";
      const ringClass = isKnown ? "known" : "unknown";
      const icon = isKnown ? "&#10003;" : "&#33;";

      box.innerHTML = `
        <div class="status-ring ${ringClass}">${icon}</div>
        <div class="status-name">${name}</div>
        <div>${badgeFor(data.event_type)}</div>
        <div class="status-meta">${data.timestamp}</div>
      `;
    }

    async function refreshLogs() {
      const res = await fetch("/api/events");
      const rows = await res.json();

      const feed = document.getElementById("log-feed");

      if (rows.length === 0) {
        feed.innerHTML = '<div class="empty-state">No events logged yet</div>';
        return;
      }

      feed.innerHTML = rows.map(row => {
        const label = row.person_name ?? (row.event_type === "UNKNOWN" ? "Unknown person" : "-");
        return `
          <div class="log-row">
            <span class="log-time">${row.timestamp}</span>
            ${badgeFor(row.event_type)}
            <span class="log-msg">${label}</span>
          </div>
        `;
      }).join("");
    }

    let lastUnknownFile = null;

    async function refreshGallery() {
      const res = await fetch("/api/unknown_faces");
      const files = await res.json();

      const gallery = document.getElementById("gallery");

      if (files.length === 0) {
        lastUnknownFile = null;
        gallery.innerHTML = '<div class="empty-state">No unknown faces captured</div>';
        return;
      }

      const latest = files[0];

      if (latest === lastUnknownFile) return;
      lastUnknownFile = latest;

      gallery.innerHTML = `
        <img class="unknown-face-shot" src="/unknown_faces/${latest}" alt="Latest unknown face">
        <div class="unknown-face-caption">${latest}</div>
      `;
    }

    function refreshAll() {
      refreshFaceStatus();
      refreshLogs();
      refreshGallery();
      document.getElementById("last-updated").textContent =
        "Live · updated " + new Date().toLocaleTimeString();
    }

    refreshAll();
    setInterval(refreshAll, POLL_INTERVAL_MS);
  </script>
</body>
</html>
