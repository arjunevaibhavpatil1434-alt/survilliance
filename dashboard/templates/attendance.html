<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Attendance</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">
  <link href="{{ url_for('static', filename='css/dashboard.css') }}" rel="stylesheet">
</head>
<body>

  <div class="topbar">
    <h1>Attendance</h1>
    <div class="topbar-right">
      <div class="nav-pills-custom">
        <a href="/">Live Dashboard</a>
        <a href="/attendance" class="active">Attendance</a>
      </div>
      <div class="live-indicator">
        <span class="live-dot"></span>
        <span id="last-updated">Live &middot; updating...</span>
      </div>
    </div>
  </div>

  <div class="summary-strip">
    <div class="summary-card">
      <div class="value" id="summary-count">0</div>
      <div class="label">Records shown</div>
    </div>
    <div class="summary-card">
      <div class="value" id="summary-people">0</div>
      <div class="label">Unique people</div>
    </div>
  </div>

  <div class="panel">
    <div class="filter-bar">
      <div>
        <label for="date-filter">Date</label>
        <input type="date" id="date-filter" class="form-control">
      </div>
      <button class="btn btn-primary" id="apply-filter">Filter</button>
      <button class="btn btn-outline-secondary" id="clear-filter">Show All</button>
      <a class="btn btn-success ms-auto" id="export-btn" href="/attendance/export.csv">
        Download CSV
      </a>
    </div>

    <div class="table-responsive">
      <table class="table table-sm" id="attendance-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Person</th>
            <th>Date</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="attendance-empty" class="empty-state" style="display:none;">
      No attendance records for this filter
    </div>
  </div>

  <script>
    const POLL_INTERVAL_MS = 5000;

    function currentDateFilter() {
      return document.getElementById("date-filter").value;
    }

    function buildQuery() {
      const date = currentDateFilter();
      return date ? `?date=${encodeURIComponent(date)}` : "";
    }

    async function refreshAttendance() {
      const res = await fetch(`/api/attendance${buildQuery()}`);
      const rows = await res.json();

      const tbody = document.querySelector("#attendance-table tbody");
      const emptyState = document.getElementById("attendance-empty");

      tbody.innerHTML = "";

      if (rows.length === 0) {
        emptyState.style.display = "block";
      } else {
        emptyState.style.display = "none";

        rows.forEach(row => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${row.id}</td>
            <td>${row.person_name}</td>
            <td>${row.date}</td>
            <td>${row.time}</td>
          `;
          tbody.appendChild(tr);
        });
      }

      document.getElementById("summary-count").textContent = rows.length;
      document.getElementById("summary-people").textContent =
        new Set(rows.map(r => r.person_name)).size;

      document.getElementById("export-btn").href = `/attendance/export.csv${buildQuery()}`;

      document.getElementById("last-updated").textContent =
        "Live · updated " + new Date().toLocaleTimeString();
    }

    document.getElementById("apply-filter").addEventListener("click", refreshAttendance);
    document.getElementById("clear-filter").addEventListener("click", () => {
      document.getElementById("date-filter").value = "";
      refreshAttendance();
    });

    refreshAttendance();
    setInterval(refreshAttendance, POLL_INTERVAL_MS);
  </script>
</body>
</html>
